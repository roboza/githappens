# Packaging (spec 15 §6.4–6.5). Signing and notarization are driven entirely by env vars, so local
# `pnpm dist` builds stay unsigned and CI signs only when the secrets exist (.github/workflows/release.yml):
#   Windows (Authenticode, PFX):  CSC_LINK / WIN_CSC_LINK (base64 or path) + CSC_KEY_PASSWORD / WIN_CSC_KEY_PASSWORD
#   Windows (Azure Trusted Signing): AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET in env, plus
#     win.azureSignOptions (endpoint, certificateProfileName, codeSigningAccountName, publisherName) —
#     passed by CI as `-c.win.azureSignOptions.*` so unsigned local builds don't try to use it.
#   macOS (Developer ID):  CSC_LINK + CSC_KEY_PASSWORD (or a keychain identity)
#   macOS notarization (auto when set): APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
#     (or APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER)
#   Publishing: CI builds with --publish never and attaches the files to a draft GitHub release itself
#   (release.yml), then publishes it once every OS/arch is built and the manifests are merged.
appId: dev.githappens.desktop
productName: GitHappens
copyright: Copyright © 2026 GitHappens contributors
# Version-less asset names (spec 15 §6.5, docs/releases.md): every release carries the same file names,
# so https://github.com/roboza/githappens/releases/latest/download/<name> always serves the newest stable
# build. The version lives in the release tag (v<version>), which also keeps differential updates working:
# electron-updater finds the old .blockmap by swapping the version in the download URL's tag segment.
#   GitHappens-win-x64.zip  GitHappens-mac-arm64.zip  GitHappens-linux-x64.tar.gz  GitHappens-linux-x86_64.AppImage
#   GitHappens-linux-amd64.deb  GitHappens-linux-x86_64.rpm  (+ arm64 / aarch64 variants)
artifactName: ${productName}-${os}-${arch}.${ext}
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - '**/*.node'
  # node-pty's Windows helpers (OpenConsole.exe, conpty.dll, worker scripts) must be on disk
  - 'node_modules/@lydell/node-pty*/**'
extraResources:
  # Bundled portable git (dugite download) → resources/git
  - from: node_modules/dugite/git
    to: git
  # Release notes for the in-app "What's new" view → resources/CHANGELOG.md
  - from: CHANGELOG.md
    to: CHANGELOG.md
  # Init dialog .gitignore / LICENSE templates (spec 03) → resources/templates
  - from: resources/templates
    to: templates
# Native deps ship N-API prebuilds (node-pty, @parcel/watcher); nothing to rebuild per Electron ABI.
npmRebuild: false
protocols:
  - name: GitHappens
    schemes: [githappens]

win:
  # App icons: build/icon.svg rasterized to icon.png (1024²), icon.ico and icon.icns.
  icon: build/icon.ico
  # `githappens` command: resources\bin is added to the user PATH by build/installer.nsh (spec 15 §6.4).
  extraResources:
    - from: build/bin/githappens.cmd
      to: bin/githappens.cmd
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # Reject a tampered update whose publisher differs from the running app (only once signed).
  verifyUpdateCodeSignature: true
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  differentialPackage: true
  artifactName: ${productName}-Setup-${arch}.${ext}
  # customInstall / customUnInstall: add/remove "$INSTDIR\resources\bin" on the user PATH.
  include: build/installer.nsh

mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
    # zip is what electron-updater downloads on macOS
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # notarize: unset → electron-builder notarizes automatically when the APPLE_* env vars are present.
dmg:
  artifactName: ${productName}-mac-${arch}.${ext}

linux:
  icon: build/icon.png
  # Stable binary name inside linux-unpacked / the AppImage (the package name is scoped).
  executableName: githappens
  # deb/rpm link /usr/bin/githappens to this launcher (after-install.sh); see also CliInstaller.
  extraResources:
    - from: build/bin/githappens
      to: bin/githappens
    # Window icon (BrowserWindow `icon`; Linux has no executable icon)
    - from: build/icon.png
      to: icon.png
  # arm64 builds come from native ubuntu-24.04-arm runners (release.yml), so native modules and the
  # bundled git match the target arch.
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
  category: Development
  maintainer: GitHappens contributors
  synopsis: Cross-platform desktop Git client
  # Only the AppImage updates in place; deb/rpm/tar.gz show a download link (UpdaterService 'manual').
deb:
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
rpm:
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh

publish:
  # GitHub Releases (docs/releases.md) serve both the downloads and the electron-updater feed; this block
  # is baked into the app as resources/app-update.yml. Stable versions are normal releases and write
  # latest*.yml; preview versions (x.y.z-preview.N, nightly.yml) are GitHub prereleases and write
  # preview*.yml. The github provider ignores `detectUpdateChannel`, so release.yml passes
  # `-c.publish.channel=preview` for prerelease versions; local builds default to `latest`.
  provider: github
  owner: roboza
  repo: githappens
  # CI creates the draft itself (release.yml "prepare"), uploads every OS/arch into it, merges the
  # per-arch manifests and only then publishes it, so clients never see a half-uploaded release.
  releaseType: draft
